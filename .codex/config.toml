# Codex legge direttamente il CLAUDE.md esistente: una sola sorgente di verita'
# mantiene la compatibilita' in entrambe le direzioni.
project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 65536
model_verbosity = "low"

[features]
hooks = true
multi_agent = true

[agents]
# Limite per-sessione allineato al profilo personale (2) per contenere memoria,
# swap e fetch concorrenti in questo workspace. La configurazione personale
# resta indipendente per gli altri repo.
# Il coordinatore GitHub ha concorrenza separata; i comandi pesanti usano il lease.
max_concurrent_threads_per_session = 2

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
# Solo valori uguali su ogni Mac. WORKSPACE e GOOGLE_APPLICATION_CREDENTIALS
# dipendono dall'utente: stanno nel ~/.codex/config.toml di ciascuna macchina
# (stessa tabella), perche' qui un path assoluto vale per un solo utente e,
# essendo il layer di progetto, sovrascriverebbe quello giusto della macchina.
SKIP_FUEL_DAILY = "1"
SKIP_WEEKLY_EMPLOYERS = "1"
SKIP_JOB_MARKET_SNAPSHOT = "1"
SKIP_HEALTH_PREMIUMS = "1"
SKIP_ORPHAN_LANDINGS = "1"
SKIP_BORDER_WAIT = "1"
SKIP_CI_CHECK = "1"
FAST_BUILD = "1"
NODE_OPTIONS = "--max-old-space-size=12288"
FRONTALIERE_GH_COORDINATOR = "1"

[analytics]
# Evita warning locali quando il daemon condiviso lavora con molto fan-out.
enabled = false
